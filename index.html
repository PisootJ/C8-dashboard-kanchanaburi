<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C8 Dashboard — ติดตาม Workflow การประเมินตำแหน่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{
  /* Cream/brown minimal palette */
  --bg:#F5F0E8;
  --surface:#FDFAF5;
  --surface2:#EDE8DE;
  --surface3:#E4DCCE;
  --border:#D9D0C0;
  --border2:#C8BCAA;
  --text:#2C2416;
  --text2:#7A6E5F;
  --text3:#A89F92;
  /* Accent — muted earth tones */
  --blue-bg:#EAF0F8;--blue:#4270A0;--blue-dark:#2A4E78;--blue-mid:#6A94C4;
  --green-bg:#E8F2E4;--green:#4A7A32;--green-dark:#2E5A1E;
  --amber-bg:#F5EDD8;--amber:#8A6020;--amber-dark:#5E3E0A;--amber-mid:#C4943A;
  --red-bg:#F5E8E8;--red:#9A3030;--red-dark:#6A1E1E;
  --purple-bg:#EDE8F5;--purple:#6254A8;--purple-dark:#40347E;
  --teal-bg:#E4F2EE;--teal:#2E7A62;--teal-dark:#1A5444;
  --brown:#7A6048;--brown-bg:#F0E8D8;
  --radius:10px;--radius-sm:7px;--radius-lg:16px;
  --shadow:0 1px 4px rgba(44,36,22,.07);
  --shadow-md:0 6px 20px rgba(44,36,22,.12),0 2px 6px rgba(44,36,22,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:20px;-webkit-font-smoothing:antialiased}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ===== HEADER ===== */
.page-header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;
  box-shadow:0 1px 0 var(--border),0 2px 8px rgba(44,36,22,.04);
}
.logo{display:flex;align-items:center;gap:.875rem}
.logo-badge{
  width:38px;height:38px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--brown) 0%,#5A4030 100%);
  display:flex;align-items:center;justify-content:center;
  color:#F5EDD8;font-weight:600;font-size:14px;letter-spacing:-.3px;
  box-shadow:0 2px 6px rgba(90,64,48,.3);
}
.logo-text h1{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.3px}
.logo-text p{font-size:11px;color:var(--text3);margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw{position:relative}
.sw i.arrow{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
select{
  appearance:none;padding:7px 30px 7px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border2);background:var(--surface2);color:var(--text);
  font-size:13px;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:border-color .15s;
}
select:hover{border-color:var(--brown)}
select:focus{outline:none;border-color:var(--brown)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(44,36,22,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);animation:popIn .18s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;gap:10px}
.modal-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text)}
.modal-close{width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;transition:all .15s}
.modal-close:hover{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.modal-body{padding:1.1rem 1.25rem;font-size:14px}

/* ===== MAIN ===== */
.main{max-width:100%;margin:0 auto;padding:2rem 3rem}

/* ===== KPI ===== */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:1.1rem 1.2rem;cursor:default;transition:all .18s;position:relative;overflow:hidden;
}
.kpi-card.clickable{cursor:pointer}
.kpi-card.clickable:hover{border-color:var(--border2);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kpi-icon{font-size:22px;margin-bottom:.6rem}
.kpi-label{font-size:15px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.4rem}
.kpi-num{font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:500;line-height:1;margin-bottom:.3rem}
.kpi-sub{font-size:15px;color:var(--text3);display:flex;align-items:center;gap:4px}
.c-gray .kpi-num{color:var(--text)}
.c-green .kpi-icon,.c-green .kpi-num{color:var(--green)}
.c-red .kpi-icon,.c-red .kpi-num{color:var(--red)}
.c-amber .kpi-icon,.c-amber .kpi-num{color:var(--amber)}
.kpi-expand{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;display:none;animation:slideDown .2s ease}
.kpi-expand.open{display:block}
.expand-title{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.875rem;display:flex;align-items:center;gap:6px}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.sub-card{background:var(--surface2);border-radius:var(--radius-sm);padding:.875rem 1rem;border:1px solid var(--border)}
.sub-card-label{font-size:11px;color:var(--text2);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.4rem;display:flex;align-items:center;gap:4px}
.sub-card-num{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:500;color:var(--green)}
.sub-card-num.amber{color:var(--amber)}.sub-card-num.teal{color:var(--teal)}

/* ===== FLOW CARD (clickable) ===== */
.flow-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  margin-bottom:1.25rem;overflow:hidden;
}
.flow-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 1.4rem;cursor:pointer;transition:background .15s;user-select:none;
}
.flow-toggle:hover{background:var(--surface2)}
.flow-toggle-left{display:flex;align-items:center;gap:.875rem}
.flow-icon-wrap{
  width:44px;height:44px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,#D4C4A8 0%,#C4B094 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--brown);flex-shrink:0;
  box-shadow:0 2px 6px rgba(122,96,72,.2);
}
.flow-toggle-text h3{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.flow-toggle-text p{font-size:12px;color:var(--text3);margin-top:2px}
.flow-toggle-right{display:flex;align-items:center;gap:8px}
.flow-chevron{font-size:18px;color:var(--text3);transition:transform .25s}
.flow-chevron.open{transform:rotate(180deg)}
.flow-body{display:none;padding:0 1.4rem 1.25rem;animation:fadeIn .2s ease}
.flow-body.open{display:block}
.flow-divider{height:1px;background:var(--border);margin-bottom:1.1rem}
/* Main flow row */
.flow-main{display:flex;align-items:center;gap:0;margin-bottom:1rem;flex-wrap:wrap;gap:2px}
.fstep{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;
  border:1px solid;white-space:nowrap;min-width:96px;text-align:center;flex:1;
}
.fstep-num{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;opacity:.7}
.fstep-icon{font-size:20px;margin:2px 0}
.fstep-label{font-size:11px;font-weight:500}
.flow-conn{display:flex;align-items:center;color:var(--text3);font-size:18px;padding:0 2px;flex-shrink:0}
/* Branch */
.flow-branch-wrap{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:.875rem 1rem;margin-top:.5rem;
}
.branch-head{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;font-size:12px;font-weight:500;color:var(--text2)}
.branch-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;background:var(--amber-bg);color:var(--amber-dark);border:1px solid var(--border)}
.flow-branch{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.fstep-sm{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 11px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;
  border:1px solid;white-space:nowrap;
}
.flow-arr{color:var(--text3);font-size:16px;flex-shrink:0}

/* ===== SECTION ===== */
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1rem;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem .875rem;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border)}
.section-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.2px;color:var(--text)}
.section-body{padding:.75rem 1.25rem 1rem}
.chip-bar{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all .15s}
.chip:hover{border-color:var(--brown);color:var(--brown)}
.chip.act{background:var(--brown-bg);color:var(--brown);border-color:var(--border2)}
.chip i{font-size:12px}

/* ===== BADGE ===== */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.b-blue{background:var(--blue-bg);color:var(--blue-dark)}
.b-green{background:var(--green-bg);color:var(--green-dark)}
.b-amber{background:var(--amber-bg);color:var(--amber-dark)}
.b-red{background:var(--red-bg);color:var(--red-dark)}
.b-purple{background:var(--purple-bg);color:var(--purple-dark)}
.b-teal{background:var(--teal-bg);color:var(--teal-dark)}
.b-brown{background:var(--brown-bg);color:var(--brown)}

/* ===== AVATAR ===== */
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.av-b{background:var(--blue-bg);color:var(--blue)}.av-g{background:var(--green-bg);color:var(--green)}
.av-a{background:var(--amber-bg);color:var(--amber)}.av-r{background:var(--red-bg);color:var(--red)}
.av-p{background:var(--purple-bg);color:var(--purple)}.av-t{background:var(--teal-bg);color:var(--teal)}

/* ===== DOT ===== */
.dot{width:7px;height:7px;border-radius:50%;animation:pulse 1.6s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.d-b{background:var(--blue-mid)}.d-g{background:#5A9A40}.d-a{background:var(--amber-mid)}
.d-r{background:#C44848}.d-p{background:#8878CC}.d-t{background:#3A9A7A}

/* ===== YEAR PILLS ===== */
.list-filters{display:flex;align-items:center;gap:8px;margin-bottom:.875rem;flex-wrap:wrap;padding:.625rem .75rem;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.list-filter-label{font-size:11px;color:var(--text3);white-space:nowrap;font-weight:500;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:4px}
.ypill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text2);transition:all .15s;font-family:'IBM Plex Mono',monospace}
.ypill:hover{border-color:var(--brown);color:var(--brown)}
.ypill.act{background:var(--brown-bg);color:var(--brown);border-color:var(--border2)}

/* ===== TABLE ===== */
.list-table{width:100%;border-collapse:collapse}
.list-table th{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;background:var(--surface2)}
.list-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.list-table tr:last-child td{border-bottom:none}
.list-table tbody tr{cursor:pointer;transition:background .12s}
.list-table tbody tr:hover{background:var(--brown-bg)}
.tname{font-weight:500;color:var(--text);margin-bottom:1px}
.tpos{font-size:11px;color:var(--text3)}
.tdate{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2)}
.tdate.na{color:var(--text3)}
.telig{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--teal)}
.telig.na{color:var(--text3);font-weight:400}
.td-center{text-align:center}
.tr-hint{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px}

/* ===== MODAL DETAIL ===== */
.det-sec{background:var(--surface2);border-radius:var(--radius-sm);padding:.875rem;margin-bottom:8px;border:1px solid var(--border)}
.det-sec:last-child{margin-bottom:0}
.det-sec-head{font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin-bottom:.875rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dr{display:flex;gap:8px;margin-bottom:9px;font-size:13px;align-items:baseline}
.dr:last-of-type{margin-bottom:0}
.dl{color:var(--text2);flex-shrink:0;min-width:140px;display:flex;align-items:center;gap:5px}
.dv{color:var(--text);font-weight:500}
.day-boxes{display:flex;gap:6px;flex-wrap:wrap;margin-top:.875rem}
.day-box{background:var(--blue-bg);border-radius:var(--radius-sm);padding:7px 11px;text-align:center;min-width:90px;border:1px solid var(--border)}
.day-box.teal-box{background:var(--teal-bg);border-color:var(--teal)}
.day-box.teal-box .day-num{color:var(--teal)}
.day-num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;color:var(--blue);line-height:1}
.day-lbl{color:var(--text3);font-size:11px;margin-top:4px;line-height:1.4}
.pending-note{font-size:12px;color:var(--amber-dark);background:var(--amber-bg);border-radius:var(--radius-sm);padding:.5rem .75rem;margin-top:.5rem;border:1px solid var(--border);display:flex;align-items:center;gap:6px}
.blink-date{animation:pulse 1.2s ease-in-out infinite;color:var(--amber)}
.elig-box{background:var(--teal-bg);border:1px solid var(--teal);border-radius:var(--radius-sm);padding:.875rem 1rem;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.elig-icon{font-size:26px;color:var(--teal);flex-shrink:0}
.elig-label{font-size:12px;color:var(--teal-dark);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.elig-date{font-size:22px;font-weight:600;color:var(--teal-dark)}
.elig-sub{font-size:13px;color:var(--teal);margin-top:3px}

.nodata{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.update-time{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;padding:.75rem 2rem;border-top:1px solid var(--border);margin-top:1rem}
/* section collapse */
.section-head{cursor:pointer;transition:background .15s;user-select:none}
.section-head:hover{background:var(--surface2)}
.section-body{display:none;animation:fadeIn .2s ease}
.section-body.open{display:block}
.sec-chevron{font-size:18px;color:var(--text3);transition:transform .25s;flex-shrink:0}
.sec-chevron.open{transform:rotate(180deg)}

@media(max-width:768px){
  .page-header{padding:1rem}.main{padding:1rem}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .list-table th:nth-child(4),.list-table td:nth-child(4){display:none}
}
@media(max-width:480px){
  .kpi-num{font-size:32px}
  .list-table th:nth-child(3),.list-table td:nth-child(3){display:none}
}
</style>
</head>
<body>

<header class="page-header">
  <div class="logo">
    <div class="logo-badge">C8</div>
    <div class="logo-text">
      <h1>C8 Dashboard</h1>
      <p>ติดตาม workflow การประเมินตำแหน่งชำนาญการ</p>
    </div>
  </div>
  <div class="header-right">
    <div class="sw">
      <select id="posF" onchange="render()">
        <option value="">ทุกตำแหน่ง/ระดับ</option>
        <option value="นักวิชาการสาธารณสุขชำนาญการ">นักวิชาการสาธารณสุข ชก.</option>
        <option value="นักสาธารณสุขชำนาญการ">นักสาธารณสุข ชก.</option>
        <option value="พยาบาลชำนาญการพิเศษ">พยาบาล ชพ.</option>
        <option value="พยาบาลวิชาชีพชำนาญการ">พยาบาลวิชาชีพ ชก.</option>
        <option value="นายแพทย์ชำนาญการ">นายแพทย์ ชก.</option>
        <option value="ทันตแพทย์ชำนาญการ">ทันตแพทย์ ชก.</option>
      </select>
      <i class="ti ti-chevron-down arrow"></i>
    </div>
  </div>
</header>

<!-- Person Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Flow Modal -->
<div class="modal-overlay" id="flowModalOverlay" onclick="closeFlowModalOutside(event)">
  <div class="modal-box" style="max-width:800px">
    <div class="modal-header">
      <div class="modal-title">
        <span style="width:36px;height:36px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#D4C4A8,#C4B094);display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--brown)"><i class="ti ti-route"></i></span>
        ขั้นตอนการทำตำแหน่งหลังได้รับการคัดเลือก
      </div>
      <button class="modal-close" onclick="closeFlowModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="flowModalBody"></div>
  </div>
</div>

<main class="main">

  <div class="kpi-row" id="kpiRow"></div>
  <div class="kpi-expand" id="kx-pass">
    <div class="expand-title"><i class="ti ti-award"></i> ผ่านการประเมิน — รายละเอียด</div>
    <div class="sub-grid" id="kx-pass-inner"></div>
  </div>
  <div class="kpi-expand" id="kx-fix">
    <div class="expand-title"><i class="ti ti-pencil"></i> รอแก้ไข — รายละเอียด</div>
    <div class="sub-grid" id="kx-fix-inner"></div>
  </div>

  <!-- Flow Card (clickable) -->
  <div class="flow-card">
    <div class="flow-toggle" onclick="openFlowModal()">
      <div class="flow-toggle-left">
        <div class="flow-icon-wrap"><i class="ti ti-map-2"></i></div>
        <div class="flow-toggle-text">
          <h3>ขั้นตอนการทำตำแหน่งหลังได้รับการคัดเลือก</h3>
          <p>คลิกเพื่อดู workflow รายละเอียด 7 ขั้นตอน</p>
        </div>
      </div>

// ========= DATA =========
// วันที่ในรูปแบบ m/d/yy (พ.ศ. 2 หลัก) ตรงกับ Google Sheet
// eligibleDate = คอลัมน์ D "วันที่ประกาศประเมินบุคคล"
let DATA=[];

// ========= LIVE DATA LOADER =========
(function(){
  const s=document.createElement('style');
  s.textContent='.ld-ov{position:fixed;inset:0;background:#F5F0E8;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:inherit}.ld-sp{width:32px;height:32px;border:3px solid #C8BCAA;border-top-color:#7A6048;border-radius:50%;animation:ld-s .8s linear infinite}@keyframes ld-s{to{transform:rotate(360deg)}}.ld-t{font-size:13px;color:#7A6E5F}.ld-d{font-size:11px;color:#7A6E5F}.ld-e{background:#F5E8E8;border:1px solid #9A3030;border-radius:8px;padding:10px 14px;color:#6A1E1E;font-size:13px;max-width:360px;text-align:center;display:none}.ld-b{display:none;padding:6px 16px;border-radius:8px;border:1px solid #C8BCAA;background:#EDE8DE;cursor:pointer;font-size:13px}';

function _dbg(m){const e=document.getElementById('ldD');if(e)e.innerHTML+='<div>→ '+m+'</div>';}

function _parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i],n=t[i+1];
    if(q){if(c==='"'&&n==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f.trim());f='';}
    else if(c==='\r'&&n==='\n'){row.push(f.trim());rows.push(row);row=[];f='';i++;}
    else if(c==='\n'||c==='\r'){row.push(f.trim());rows.push(row);row=[];f='';}
    else f+=c;}
  }
  if(f||row.length){row.push(f.trim());rows.push(row);}
  return rows;
}

function _cvt(d){
  if(!d||!d.trim())return'';
  const p=d.split('/');if(p.length!==3)return d;
  let y=parseInt(p[2]);if(isNaN(y))return d;
  if(y>=2500) return p[0]+'/'+p[1]+'/'+y;  // BE 4 หลัก → คงไว้ (2569)
  if(y>=2000) y=y+543;                      // CE 4 หลัก → BE (2025→2568)
  else y=(2000+y)+543;                      // CE 2 หลัก → BE (25→2568)
  return p[0]+'/'+p[1]+'/'+y;
}

// JSONP fallback (for networks that block direct CSV fetch)
function _loadViaJSONP() {
  return new Promise((resolve, reject) => {
    const cb = "_gviz_" + Date.now();
    const tid = setTimeout(() => { delete window[cb]; reject(new Error("JSONP timeout")); }, 12000);
    window[cb] = function(r) {
      clearTimeout(tid); delete window[cb];
      if (!r || r.status !== "ok") { reject(new Error("gviz: " + JSON.stringify(r && r.errors))); return; }
      const cols = r.table.cols || [];
      const dataRows = (r.table.rows || []).map(function(row) {
        return cols.map(function(c, i) {
          return (row.c && row.c[i] && row.c[i].v != null) ? String(row.c[i].v) : "";
        });
      });
      resolve(dataRows);
    };
    const s = document.createElement("script");
    s.onerror = function() { clearTimeout(tid); delete window[cb]; reject(new Error("JSONP script error")); };
    s.src = "https://docs.google.com/spreadsheets/d/1hbXCaO8spDuEJ8Yqji4YcWUmuKkYEHX4QmWgewGZ3zg/gviz/tq?tqx=out:json;handler=" + cb;
    document.head.appendChild(s);
  });
}

function _loadViaJSONP() {

      });

    };

    s.src = "https://docs.google.com/spreadsheets/d/1hbXCaO8spDuEJ8Yqji4YcWUmuKkYEHX4QmWgewGZ3zg/gviz/tq?tqx=out:json;handler=" + cb;

async function loadData(){
  const ov=document.getElementById("ldOv"),eEl=document.getElementById("ldE"),bEl=document.getElementById("ldB"),dEl=document.getElementById("ldD"),tEl=document.getElementById("ldT");
  if(ov)ov.style.display="flex";if(eEl)eEl.style.display="none";if(bEl)bEl.style.display="none";if(dEl)dEl.innerHTML="";if(tEl)tEl.textContent="กำลังโหลดข้อมูล...";
  try{
    let rows;
    try {
      _dbg("วิธีที่ 1: CSV โดยตรง...");
      const url="https://docs.google.com/spreadsheets/d/1hbXCaO8spDuEJ8Yqji4YcWUmuKkYEHX4QmWgewGZ3zg/export?format=csv&gid=0";
      const ctrl=new AbortController(), tid2=setTimeout(function(){ctrl.abort();},8000);
      const res=await fetch(url,{signal:ctrl.signal}); clearTimeout(tid2);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const txt=await res.text();
      if(txt.trim().startsWith("<")) throw new Error("ได้ HTML แทน CSV");
      _dbg("CSV ✓ ("+txt.split("\n").length+" แถว)");
      rows=_parseCSV(txt).slice(2);
    } catch(e1) {
      _dbg("วิธีที่ 1 ล้มเหลว: "+e1.message);
      _dbg("วิธีที่ 2: JSONP...");
      const jsonpRows = await _loadViaJSONP();
      _dbg("JSONP ✓ ("+jsonpRows.length+" แถว)");
      rows = jsonpRows;
    }
    DATA=rows.filter(function(c){return c.length>=3&&c[1]&&c[1].trim();}).map(function(c,i){
      const g=function(j){return(c[j]||"").trim();};
      const r2s=g(12),r2c=g(13),r2e=g(14),r2r=g(15),r2d=g(16),r2o=g(17);
      const hr2=r2s||r2c||r2e||r2r||r2d||r2o;
      return {id:i+1,name:g(1),pos:g(2),eligibleDate:_cvt(g(3)),
        r1:{submit:_cvt(g(4)),check:g(5),sent:_cvt(g(6)),result:g(7),resultDate:_cvt(g(8)),deadline:_cvt(g(9)),order:_cvt(g(10))},
        r2:hr2?{submit:_cvt(r2s),check:r2c,sent:_cvt(r2e),result:r2r,resultDate:_cvt(r2d),order:_cvt(r2o)}:null,
        note:g(11)};
    }).sort(function(a,b){
      const da=parseDate(a.r1&&a.r1.submit||""),db=parseDate(b.r1&&b.r1.submit||"");
      if(!da&&!db)return 0;if(!da)return 1;if(!db)return-1;return da-db;
    });
    _dbg("DATA ✓ "+DATA.length+" รายการ");
    const pos=[...new Set(DATA.map(function(p){return p.pos;}).filter(Boolean))].sort();
    const sel=document.getElementById("posF");
    if(sel)sel.innerHTML="<option value=\"\">" + "ทุกตำแหน่ง/ระดับ</option>"+pos.map(function(p){return "<option value=\""+p+"\">"+p+"</option>";}).join("");
    const now=new Date();
    const utEl=document.getElementById("updateTime");
    if(utEl)utEl.textContent="อัปเดตล่าสุด: "+now.getDate()+"/"+(now.getMonth()+1)+"/"+(now.getFullYear()+543)+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+" น.";
    if(ov)ov.style.display="none";
    render();
  }catch(e){
    console.error(e);
    if(eEl){eEl.textContent="โหลดไม่สำเร็จ: "+e.message;eEl.style.display="block";}
    if(bEl)bEl.style.display="block";
    if(tEl)tEl.textContent="โหลดข้อมูลไม่สำเร็จ";
  }
}

// ========= UTILS =========
function parseDate(s){
  if(!s) return null;
  const p=s.split('/');
  if(p.length<3) return null;
  let y=parseInt(p[2]);
  if(y<100) y+=2500;
  return new Date(y-543,parseInt(p[0])-1,parseInt(p[1]));
}
function diffDays(a,b){if(!a||!b)return null;return Math.round(Math.abs(b-a)/86400000);}
function fmt(s){return s||'—'}
function ini(n){return n.replace(/^(นาย|นาง|นางสาว)/,'').trim().charAt(0);}
function getEligYear(p){const d=parseDate(p.eligibleDate);return d?d.getFullYear()+543:null;}
function getDaysFromEligToOrder(p){
  const elig=parseDate(p.eligibleDate);if(!elig)return null;
  const ord=p.r2&&p.r2.order?parseDate(p.r2.order):p.r1&&p.r1.order?parseDate(p.r1.order):null;
  return ord?diffDays(elig,ord):null;
}

// ========= STATUS =========
function isPassR1(p){return p.r1&&p.r1.result&&p.r1.result.includes('ผ่านการประเมิน')&&!p.r1.result.includes('ไม่ผ่าน');}
function isPassR2(p){return p.r2&&p.r2.result&&p.r2.result.includes('ผ่านการประเมิน')&&!p.r2.result.includes('ไม่ผ่าน');}
function isPass(p){return isPassR1(p)||isPassR2(p);}
function isFailR1(p){return p.r1&&p.r1.result&&p.r1.result.includes('ไม่ผ่านการประเมิน');}
function isFailR2(p){return p.r2&&p.r2.result&&p.r2.result.includes('ไม่ผ่านการประเมิน');}
function isFail(p){return isFailR1(p)||isFailR2(p);}
function isFixType(p){return p.r1&&p.r1.result&&p.r1.result.includes('ปรับปรุงแก้ไข');}
function isPendingR2(p){return p.r2&&p.r2.pending===true;}
function hasSentR2(p){return p.r2&&!p.r2.pending&&p.r2.submit;}
function getStatus(p){
  if(isPass(p)) return 'pass';
  if(isFail(p)&&!isFixType(p)) return 'fail';
  if(isFixType(p)) return 'fix';
  return 'inprog';
}
function overallLabel(p){
  const s=getStatus(p);
  if(s==='pass') return isPassR2(p)?{t:'ผ่าน (รอบ 2)',b:'b-green',d:'d-g',av:'av-g'}:{t:'ผ่าน (รอบ 1)',b:'b-green',d:'d-g',av:'av-g'};
  if(s==='fail') return {t:'ไม่ผ่านการประเมิน',b:'b-red',d:'d-r',av:'av-r'};
  if(s==='fix'){
    const is6=p.r1.result.includes('เป็นสาระสำคัญ')&&!p.r1.result.includes('ไม่เป็น');
    if(!hasSentR2(p)||isPendingR2(p)) return {t:is6?'กำลังแก้ไข (6 เดือน)':'กำลังแก้ไข (2 เดือน)',b:'b-amber',d:'d-a',av:'av-a'};
    return {t:is6?'ส่งรอบ 2 (6 เดือน)':'ส่งรอบ 2 (2 เดือน)',b:'b-purple',d:'d-p',av:'av-p'};
  }
  return {t:'ระหว่างดำเนินงาน',b:'b-blue',d:'d-b',av:'av-b'};
}
function getR1Lbl(r){
  if(!r) return '—';
  if(r.order) return 'ทำคำสั่งแล้ว';
  if(r.result&&r.result.includes('ผ่านการประเมิน')&&!r.result.includes('ไม่ผ่าน')) return 'ผ่านการประเมิน';
  if(r.result&&r.result.includes('ไม่ผ่าน')) return 'ไม่ผ่าน';
  if(r.result&&r.result.includes('ปรับปรุงแก้ไข')) return r.result.includes('เป็นสาระสำคัญ')&&!r.result.includes('ไม่เป็น')?'ปรับปรุงแก้ไข (6 เดือน)':'ปรับปรุงแก้ไข (2 เดือน)';
  if(r.result&&r.result.includes('ระหว่าง')) return 'ระหว่างประเมิน';
  if(r.sent) return 'ส่งหน่วยประเมินแล้ว';
  return r.check||'ตรวจสอบเอกสาร';
}
function getR2Lbl(p){
  if(!p.r2) return '—';
  const r=p.r2;
  if(isPendingR2(p)) return 'กำลังดำเนินการแก้ไข';
  if(r.order) return 'ทำคำสั่งแล้ว';
  if(r.result&&r.result.includes('ผ่านการประเมิน')&&!r.result.includes('ไม่ผ่าน')) return 'ผ่านการประเมิน';
  if(r.result&&r.result.includes('ไม่ผ่าน')) return 'ไม่ผ่าน';
  if(r.result&&r.result.includes('ระหว่าง')) return 'ระหว่างประเมิน';
  if(r.sent) return 'ส่งหน่วยประเมินแล้ว';
  if(r.check) return r.check;
  return 'รอส่งเอกสาร';
}
function badgeCls(lbl){
  if(lbl.includes('ผ่านการประเมิน')) return 'b-green';
  if(lbl.includes('ไม่ผ่าน')) return 'b-red';
  if(lbl.includes('ปรับปรุง')||lbl.includes('แก้ไข')||lbl.includes('กำลัง')) return 'b-amber';
  if(lbl.includes('คำสั่ง')) return 'b-teal';
  return 'b-blue';
}
function calcDays(r){
  if(!r) return [];
  const d=[];
  const s=parseDate(r.submit),se=parseDate(r.sent),rd=parseDate(r.resultDate),od=parseDate(r.order);
  if(s&&se){const n=diffDays(s,se);if(n!==null)d.push({n,lbl:'ส่ง → หน่วยประเมิน'});}
  if(se&&rd){const n=diffDays(se,rd);if(n!==null)d.push({n,lbl:'ประเมิน → ผล'});}
  if(rd&&od){const n=diffDays(rd,od);if(n!==null)d.push({n,lbl:'ผล → คำสั่ง'});}
  return d;
}

  const p=DATA.find(x=>x.id===pid);if(!p)return;
  const ol=overallLabel(p);
  document.getElementById('modalTitle').innerHTML=`<span class="av ${ol.av}" style="width:28px;height:28px;font-size:12px">${ini(p.name)}</span>${p.name}`;
  document.getElementById('modalBody').innerHTML=buildModalBody(p);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';}
function closeModalOutside(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeFlowModal();}});

function eligBoxHTML(p){
  if(!p.eligibleDate) return '';
  const dEO=getDaysFromEligToOrder(p);
  const sub=dEO!==null?`ใช้เวลา ${dEO} วัน จนถึงวันที่ทำคำสั่ง`:'ยังไม่มีคำสั่ง';
  return `<div class="elig-box"><div class="elig-icon"><i class="ti ti-calendar-event"></i></div>
    <div><div class="elig-label"><i class="ti ti-star" style="font-size:11px"></i> วันที่ประกาศประเมินบุคคล</div>
    <div class="elig-date">${fmt(p.eligibleDate)}</div><div class="elig-sub">${sub}</div></div></div>`;
}
function roundSectionHTML(r,rnum,p){
  if(!r) return '';
  const isPend=rnum===2&&p&&isPendingR2(p);
  const lbl=rnum===1?getR1Lbl(r):getR2Lbl(p);
  const bc=badgeCls(lbl);
  const dLine=r.deadline?`<div class="dr"><span class="dl"><i class="ti ti-calendar-due"></i> กำหนดส่งแก้ไข</span><span class="dv" style="color:var(--amber)">${fmt(r.deadline)}</span></div>`:'';

  // day boxes
  const elig=parseDate(p.eligibleDate);
  const se=parseDate(r.sent);
  const rd=parseDate(r.resultDate);
  const od=parseDate(r.order);

  // กล่อง 1: ประกาศประเมิน → ส่งหน่วยประเมิน (แทน ส่ง → หน่วยประเมิน)
  const eligToSent=(elig&&se)?diffDays(elig,se):null;
  // กล่อง 2: จำนวนวันที่หน่วยประเมินอ่านผลงาน (ส่งหน่วย → ผล)
  const sentToResult=(se&&rd)?diffDays(se,rd):null;
  // กล่อง 3: วัน · ผล → คำสั่ง
  const resultToOrder=(rd&&od)?diffDays(rd,od):null;
  // กล่อง 4 teal: วันที่แจ้งผลประเมิน ถึง วันที่สสจ.ทำคำสั่ง (ประกาศ → คำสั่ง)
  const eligToOrd=(elig&&od)?diffDays(elig,od):null;

  const box1=eligToSent!==null?`<div class="day-box"><div class="day-num">${eligToSent}</div><div class="day-lbl" style="white-space:normal;line-height:1.3">วัน · ประกาศประเมิน<br>→ ส่งหน่วยประเมิน</div></div>`:'';
  const box2=sentToResult!==null?`<div class="day-box"><div class="day-num">${sentToResult}</div><div class="day-lbl" style="white-space:normal;line-height:1.3">วัน · จำนวนวันที่หน่วยประเมิน<br>อ่านผลงาน</div></div>`:'';
  const box3=resultToOrder!==null?`<div class="day-box"><div class="day-num">${resultToOrder}</div><div class="day-lbl" style="white-space:normal;line-height:1.3">วัน · ผล → คำสั่ง</div></div>`:'';
  const box4=eligToOrd!==null?`<div class="day-box teal-box"><div class="day-num">${eligToOrd}</div><div class="day-lbl" style="white-space:normal;line-height:1.3">วัน · วันที่แจ้งผลประเมิน<br>ถึง วันที่สสจ.ทำคำสั่ง</div></div>`:'';

  if(isPend){
    return `<div class="det-sec"><div class="det-sec-head"><i class="ti ti-refresh"></i> รอบที่ ${rnum} <span class="badge b-amber" style="font-size:11px">${lbl}</span></div>
      <div class="pending-note"><i class="ti ti-clock"></i> อยู่ระหว่างดำเนินการแก้ไข · กำหนดส่ง: <span class="blink-date">${fmt(p.r1.deadline)}</span></div></div>`;
  }
  return `<div class="det-sec"><div class="det-sec-head"><i class="ti ti-${rnum===1?'file-text':'refresh'}"></i> รอบที่ ${rnum} <span class="badge ${bc}" style="font-size:11px">${lbl}</span></div>
    ${r.submit?`<div class="dr"><span class="dl" style="font-size:13px"><i class="ti ti-send"></i> วันที่ส่งผลงาน</span><span class="dv" style="font-size:13px">${fmt(r.submit)}</span></div>`:''}
    ${r.check?`<div class="dr"><span class="dl" style="font-size:13px"><i class="ti ti-search"></i> สสจ. ตรวจสอบ</span><span class="dv" style="font-size:13px">${r.check}</span></div>`:''}
    ${r.sent?`<div class="dr"><span class="dl" style="font-size:13px"><i class="ti ti-building"></i> วันที่ส่งหน่วยประเมิน<br><span style="font-size:11px;color:var(--text3);font-weight:400;padding-left:20px">(นับจากวันที่สสจ.ออกหนังสือ)</span></span><span class="dv" style="font-size:13px">${fmt(r.sent)}</span></div>`:''}
    ${r.result?`<div class="dr"><span class="dl" style="font-size:13px"><i class="ti ti-checkbox"></i> ผลการพิจารณา</span><span class="dv" style="font-size:13px">${r.result}</span></div>`:''}
    ${r.resultDate?`<div class="dr"><span class="dl" style="font-size:13px"><i class="ti ti-bell"></i> วันที่แจ้งผลกลับ</span><span class="dv" style="font-size:13px">${fmt(r.resultDate)}</span></div>`:''}
    ${dLine}
    ${r.order?`<div class="dr"><span class="dl" style="font-size:13px"><i class="ti ti-file-check"></i> ทำคำสั่ง</span><span class="dv" style="font-size:13px;color:var(--teal)">${fmt(r.order)}</span></div>`:''}
    ${(box1||box2||box3||box4)?`<div class="day-boxes">${box1}${box2}${box3}${box4}</div>`:''}
  </div>`;
}
function buildModalBody(p){
  return eligBoxHTML(p)+`<div style="margin-bottom:8px"><span class="badge b-brown" style="font-size:11px">${p.pos}</span></div>`+
    roundSectionHTML(p.r1,1,p)+(p.r2?roundSectionHTML(p.r2,2,p):'');
}

// ========= STATE =========
let chip1='all',chip2='all',yearFilter1='all',yearFilter2='all',activeKpi=null;
let secOpen1=false,secOpen2=false;
function toggleKpi(key){
  document.querySelectorAll('.kpi-expand').forEach(e=>e.classList.remove('open'));
  activeKpi=activeKpi===key?null:key;
  if(activeKpi) document.getElementById('kx-'+activeKpi).classList.add('open');
}
function toggleSection(round,event){
  // prevent chip clicks from bubbling to toggle
  if(event&&event.target.closest('.chip-bar')) return;
  if(round===1){
    secOpen1=!secOpen1;
    document.getElementById('secbody1').classList.toggle('open',secOpen1);
    document.getElementById('secchev1').classList.toggle('open',secOpen1);
  } else {
    secOpen2=!secOpen2;
    document.getElementById('secbody2').classList.toggle('open',secOpen2);
    document.getElementById('secchev2').classList.toggle('open',secOpen2);
  }
}
function setChip(el,round){
  const s=el.dataset.s;
  if(round==='1')chip1=s;else chip2=s;
  document.querySelectorAll(`[data-r="${round}"]`).forEach(c=>c.classList.remove('act'));
  el.classList.add('act');renderLists();
}
function setYear(yr,round){
  if(round==='1')yearFilter1=yr;else yearFilter2=yr;renderLists();
}
function filtered(){const pos=document.getElementById('posF').value;return DATA.filter(p=>!pos||p.pos===pos);}
function matchC1(p,c){const s=getStatus(p);if(c==='all')return true;return c===s;}
function matchC2(p,c){
  if(!p.r2)return false;if(c==='all')return true;
  if(c==='pass')return isPassR2(p);if(c==='fail')return isFailR2(p);
  if(c==='pending')return isPendingR2(p);
  if(c==='inprog')return !p.r2.order&&!isPendingR2(p)&&!isPassR2(p)&&!isFailR2(p);
  return true;
}
function getYears(data){const s=new Set();data.forEach(p=>{const y=getEligYear(p);if(y)s.add(y);});return[...s].sort();}
function yearPillsHTML(yrs,active,round){
  return `<div class="ypill ${active==='all'?'act':''}" onclick="setYear('all','${round}')">ทั้งหมด</div>`+
    yrs.map(y=>`<div class="ypill ${active==y?'act':''}" onclick="setYear(${y},'${round}')">${y}</div>`).join('');
}
function tableRow(p){
  const ol=overallLabel(p);
  const orderDate=p.r2&&p.r2.order?p.r2.order:p.r1&&p.r1.order?p.r1.order:'';
  const dEO=getDaysFromEligToOrder(p);
  return `<tr onclick="openModal(${p.id})" title="คลิกดูรายละเอียด">
    <td><div style="display:flex;align-items:center;gap:10px">
      <div class="av ${ol.av}" style="width:34px;height:34px;font-size:12px;flex-shrink:0">${ini(p.name)}</div>
      <div><div class="tname">${p.name}</div><div class="tpos">${p.pos}</div></div>
    </div></td>
    <td class="td-center"><span class="badge ${ol.b}" style="font-size:11px">${ol.t}</span></td>
    <td><div class="tdate ${p.eligibleDate?'':'na'}" style="display:flex;align-items:center;gap:4px"><i class="ti ti-star" style="font-size:11px;color:var(--teal)"></i>${p.eligibleDate||'—'}</div></td>
    <td><div class="tdate ${orderDate?'':'na'}" style="display:flex;align-items:center;gap:4px"><i class="ti ti-file-check" style="font-size:11px;color:var(--text3)"></i>${orderDate||'—'}</div></td>
    <td class="telig ${dEO!==null?'':'na'}">${dEO!==null?dEO+' วัน':'—'}</td>
    <td class="td-center"><div style="display:flex;align-items:center;gap:5px;justify-content:center"><div class="dot ${ol.d}"></div><i class="ti ti-chevron-right" style="font-size:13px;color:var(--text3)"></i></div></td>
  </tr>`;
}

// ========= KPI =========
function renderKPI(data){
  const total=data.length,pR1=data.filter(isPassR1),pR2=data.filter(isPassR2),pAll=data.filter(isPass);
  const fAll=data.filter(isFail),fixAll=data.filter(isFixType);
  const fix2=fixAll.filter(p=>p.r1.result.includes('ไม่เป็นสาระสำคัญ'));
  const fix6=fixAll.filter(p=>p.r1.result.includes('เป็นสาระสำคัญ')&&!p.r1.result.includes('ไม่เป็น'));
  document.getElementById('kpiRow').innerHTML=`
    <div class="kpi-card c-gray"><div class="kpi-icon"><i class="ti ti-users" style="color:var(--text3)"></i></div><div class="kpi-label">ทั้งหมด</div><div class="kpi-num">${total}</div><div class="kpi-sub"><i class="ti ti-user"></i> ราย</div></div>
    <div class="kpi-card c-green clickable" onclick="toggleKpi('pass')"><div class="kpi-icon"><i class="ti ti-award"></i></div><div class="kpi-label">ผ่านการประเมิน</div><div class="kpi-num">${pAll.length}</div><div class="kpi-sub"><i class="ti ti-chevron-down"></i> รอบ 1: ${pR1.length} · รอบ 2: ${pR2.length}</div></div>
    <div class="kpi-card c-red"><div class="kpi-icon"><i class="ti ti-circle-x"></i></div><div class="kpi-label">ไม่ผ่านการประเมิน</div><div class="kpi-num">${fAll.length}</div><div class="kpi-sub">รอบ 1: ${data.filter(isFailR1).length} · รอบ 2: ${data.filter(isFailR2).length}</div></div>
    <div class="kpi-card c-amber clickable" onclick="toggleKpi('fix')"><div class="kpi-icon"><i class="ti ti-pencil"></i></div><div class="kpi-label">รอแก้ไข</div><div class="kpi-num">${fixAll.length}</div><div class="kpi-sub"><i class="ti ti-chevron-down"></i> คลิกดูรายละเอียด</div></div>`;
  document.getElementById('kx-pass-inner').innerHTML=`
    <div class="sub-card"><div class="sub-card-label"><i class="ti ti-circle-check"></i> ผ่านรอบที่ 1</div><div class="sub-card-num">${pR1.length} <span style="font-size:14px;color:var(--text3)">ราย</span></div></div>
    <div class="sub-card"><div class="sub-card-label"><i class="ti ti-refresh"></i> ผ่านรอบที่ 2</div><div class="sub-card-num teal">${pR2.length} <span style="font-size:14px;color:var(--text3)">ราย</span></div></div>`;
  document.getElementById('kx-fix-inner').innerHTML=`
    <div class="sub-card"><div class="sub-card-label"><i class="ti ti-clock-2"></i> กำหนด 2 เดือน</div><div class="sub-card-num amber">${fix2.length} <span style="font-size:14px;color:var(--text3)">ราย</span></div></div>
    <div class="sub-card"><div class="sub-card-label"><i class="ti ti-clock-2"></i> กำหนด 6 เดือน</div><div class="sub-card-num amber">${fix6.length} <span style="font-size:14px;color:var(--text3)">ราย</span></div></div>`;
}

// ========= LISTS =========
function renderLists(){
  const data=filtered(),yrs=getYears(data);
  let r1f=data.filter(p=>matchC1(p,chip1));
  if(yearFilter1!=='all') r1f=r1f.filter(p=>getEligYear(p)==yearFilter1);
  let r2f=data.filter(p=>p.r2).filter(p=>matchC2(p,chip2));
  if(yearFilter2!=='all') r2f=r2f.filter(p=>getEligYear(p)==yearFilter2);
  const thead=`<table class="list-table"><thead><tr>
    <th><i class="ti ti-user" style="font-size:11px"></i> ชื่อ — ตำแหน่ง</th>
    <th><i class="ti ti-flag" style="font-size:11px"></i> สถานะ</th>
    <th><i class="ti ti-star" style="font-size:11px"></i> ประกาศประเมินบุคคล</th>
    <th><i class="ti ti-file-check" style="font-size:11px"></i> วันที่ทำคำสั่ง</th>
    <th><i class="ti ti-clock" style="font-size:11px"></i> วันที่ใช้</th>
    <th></th>
  </tr></thead><tbody>`;

  document.getElementById('mainList').innerHTML=`
    <div class="section-card">
      <div class="section-head" onclick="toggleSection(1,event)" style="padding:1rem 1.25rem .875rem;border-bottom:${secOpen1?'1px solid var(--border)':'none'}">
        <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div class="section-title"><i class="ti ti-file-text" style="color:var(--blue)"></i> รอบที่ 1 <span class="badge b-blue">${r1f.length} ราย</span></div>
            <div class="chip-bar" onclick="event.stopPropagation()">
              <div class="chip ${chip1==='all'?'act':''}" data-r="1" data-s="all" onclick="setChip(this,'1')">ทั้งหมด</div>
              <div class="chip ${chip1==='pass'?'act':''}" data-r="1" data-s="pass" onclick="setChip(this,'1')"><i class="ti ti-check"></i> ผ่าน</div>
              <div class="chip ${chip1==='fail'?'act':''}" data-r="1" data-s="fail" onclick="setChip(this,'1')"><i class="ti ti-x"></i> ไม่ผ่าน</div>
              <div class="chip ${chip1==='fix'?'act':''}" data-r="1" data-s="fix" onclick="setChip(this,'1')"><i class="ti ti-pencil"></i> รอแก้ไข</div>
              <div class="chip ${chip1==='inprog'?'act':''}" data-r="1" data-s="inprog" onclick="setChip(this,'1')"><i class="ti ti-loader"></i> ระหว่างดำเนิน</div>
            </div>
          </div>
          <i class="ti ti-chevron-down sec-chevron ${secOpen1?'open':''}" id="secchev1"></i>
        </div>
      </div>
      <div class="section-body ${secOpen1?'open':''}" id="secbody1" style="padding:.75rem 1.25rem 1rem">
        <div class="list-filters">
          <span class="list-filter-label"><i class="ti ti-calendar"></i> ปีที่ประกาศประเมินบุคคล</span>
          <div style="display:flex;gap:5px;flex-wrap:wrap">${yearPillsHTML(yrs,yearFilter1,'1')}</div>
        </div>
        ${r1f.length?thead+r1f.map(tableRow).join('')+'</tbody></table>':'<div class="nodata"><i class="ti ti-mood-empty"></i> ไม่มีรายการ</div>'}
      </div>
    </div>
    <div class="section-card">
      <div class="section-head" onclick="toggleSection(2,event)" style="padding:1rem 1.25rem .875rem;border-bottom:${secOpen2?'1px solid var(--border)':'none'}">
        <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div class="section-title"><i class="ti ti-refresh" style="color:var(--purple)"></i> รอบที่ 2 <span class="badge b-purple">${r2f.length} ราย</span></div>
            <div class="chip-bar" onclick="event.stopPropagation()">
              <div class="chip ${chip2==='all'?'act':''}" data-r="2" data-s="all" onclick="setChip(this,'2')">ทั้งหมด</div>
              <div class="chip ${chip2==='pass'?'act':''}" data-r="2" data-s="pass" onclick="setChip(this,'2')"><i class="ti ti-check"></i> ผ่าน</div>
              <div class="chip ${chip2==='fail'?'act':''}" data-r="2" data-s="fail" onclick="setChip(this,'2')"><i class="ti ti-x"></i> ไม่ผ่าน</div>
              <div class="chip ${chip2==='pending'?'act':''}" data-r="2" data-s="pending" onclick="setChip(this,'2')"><i class="ti ti-pencil"></i> กำลังแก้ไข</div>
              <div class="chip ${chip2==='inprog'?'act':''}" data-r="2" data-s="inprog" onclick="setChip(this,'2')"><i class="ti ti-loader"></i> ระหว่างดำเนิน</div>
            </div>
          </div>
          <i class="ti ti-chevron-down sec-chevron ${secOpen2?'open':''}" id="secchev2"></i>
        </div>
      </div>
      <div class="section-body ${secOpen2?'open':''}" id="secbody2" style="padding:.75rem 1.25rem 1rem">
        <div class="list-filters">
          <span class="list-filter-label"><i class="ti ti-calendar"></i> ปีที่ประกาศประเมินบุคคล</span>
          <div style="display:flex;gap:5px;flex-wrap:wrap">${yearPillsHTML(yrs,yearFilter2,'2')}</div>
        </div>
        ${r2f.length?thead+r2f.map(tableRow).join('')+'</tbody></table>':'<div class="nodata"><i class="ti ti-mood-empty"></i> ไม่มีรายการในรอบที่ 2</div>'}
      </div>
    </div>`;
}

function render(){yearFilter1='all';yearFilter2='all';renderKPI(filtered());renderLists();}
const now=new Date();
document.getElementById('updateTime').textContent=`อัปเดตล่าสุด: ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()+543}`;
loadData();

</script>
</body>
</html>
